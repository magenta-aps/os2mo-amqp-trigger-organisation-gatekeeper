[tool.poetry]
name = "orggatekeeper"
version = "2.7.0"
description = "OS2mo AMQP Trigger receiver that updates line management information"
authors = ["Magenta ApS <info@magenta.dk>"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://magenta.dk/"
repository = "https://git.magenta.dk/rammearkitektur/os2mo-triggers/os2mo-amqp-trigger-organisation-gatekeeper"
keywords = ["os2mo", "amqp"]

[tool.poetry.dependencies]
python = "^3.11"
gql = "^3.5.0"
uvicorn = {extras = ["standard"], version = "^0.34.3"}
fastapi = "^0.115.11"
fastramqpi = "^15.0.1"
ramodels = "^44.0.0"

[tool.poetry.group.dev.dependencies]
ariadne-codegen = "0.7.1"

[tool.poetry.group.test.dependencies]
pytest = "^8"
pytest-asyncio = "^1.4.0"
pytest-cov = "^5.0.0"
pytest-split = "^0.9.0"
asgi-lifespan = "^2.1.0"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^3.2.1"
ruff = "^0.9.7"
mypy = "^1.4.1"
deptry = "^0.25.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode="auto"

[tool.coverage.run]
omit = ["orggatekeeper/autogenerated_graphql_client/*"]

[tool.mypy]
warn_return_any = "True"
warn_unused_configs = "True"
check_untyped_defs = "True"
disallow_untyped_defs = "True"
plugins = "pydantic.mypy"
exclude = [
    "orggatekeeper/autogenerated_graphql_client"
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I"
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.deptry.per_rule_ignores]
DEP002 = [
    # uvicorn is used by the Dockerfile
    "uvicorn",
]

[tool.ariadne-codegen]
target_package_name = "autogenerated_graphql_client"
target_package_path = "orggatekeeper/"
client_name = "GraphQLClient"
schema_path = "schema.graphql"  # curl -O http://localhost:5000/graphql/v22/schema.graphql
queries_path = "queries.graphql"
include_all_inputs = false
include_all_enums = false
include_comments = false
plugins = [
    # Return values directly when only a single top field is requested
    "ariadne_codegen.contrib.shorter_results.ShorterResultsPlugin",
    # Add UNSET and UnsetType to generated input types
    "fastramqpi.ariadne.UnsetInputTypesPlugin",
    # Forbid extra fields on the generated BaseModel so typos raise an exception
    "fastramqpi.ariadne.ForbidExtraBaseModelPlugin",
]

[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"

[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"
