query GetOrgUnitHierarchy($filter: OrganisationUnitFilter!) {
  org_units(filter: $filter) {
    objects {
      validities {
        unit_hierarchy_response {
          validities {
            uuid
          }
        }
      }
    }
  }
}

query GetOrgUnitHierarchyAndParent($filter: OrganisationUnitFilter!) {
  org_units(filter: $filter) {
    objects {
      validities {
        unit_hierarchy_response {
          uuid
        }
        parent_response {
          uuid
        }
        validity {
          from
          to
        }
      }
    }
  }
}

query GetClassByUserKey($filter: ClassFilter!) {
  classes(filter: $filter) {
    objects {
      uuid
      current {
        user_key
      }
    }
  }
}

mutation CreateOrgUnit($input: OrganisationUnitCreateInput!) {
  org_unit_create(input: $input) {
    uuid
  }
}

